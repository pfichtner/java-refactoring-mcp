# Test classes run concurrently; methods within each class stay sequential.
#
# The expensive part is MavenProject.classpath() which forks "mvn dependency:build-classpath".
# The static CLASSPATH_CACHE in MavenProject means each unique fixture project path pays the
# Maven JVM startup cost at most once per test run (shared across all test instances).
# Class-level parallelism lets those first-hit Maven subprocesses run concurrently.
junit.jupiter.execution.parallel.enabled=true
junit.jupiter.execution.parallel.mode.default=same_thread
junit.jupiter.execution.parallel.mode.classes.default=concurrent
junit.jupiter.execution.parallel.config.strategy=dynamic
junit.jupiter.execution.parallel.config.dynamic.factor=1
